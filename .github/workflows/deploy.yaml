name: support.statsig.com deployment

on:
  push:
    branches: [master]

jobs:
  docker:
    runs-on: ubuntu-20.04
    #    runs-on: self-hosted
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          lfs: true
      - run: git lfs pull
      - name: npm package cache
        uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2
        env:
          cache-name: npm
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@27d0a4f181a40b142cce983c5393082c365d1480 # v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9 # v1
      - name: Login to DockerHub
        uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7 # v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a # v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: statsig/support:latest
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
      - name: Deploy to Latest Cluster
        uses: statsig-io/kubectl-via-akscli@23f529cf38681fda1a5247bccd5ed6b20d0c7f0f # main
        env:
          app_id: ${{ secrets.AZ_LATEST_SERVICE_PRINCIPLE_APP_ID }}
          password: ${{ secrets.AZ_LATEST_SERVICE_PRINCIPLE_PASSWORD }}
          tenant: ${{ secrets.AZ_LATEST_SERVICE_PRINCIPLE_TENANT }}
          region: az-westus-2
          tier: latest
        with:
          args: rollout restart deployment/support
      - name: Validate Deployment
        uses: statsig-io/kubectl-via-akscli@23f529cf38681fda1a5247bccd5ed6b20d0c7f0f # main
        env:
          app_id: ${{ secrets.AZ_LATEST_SERVICE_PRINCIPLE_APP_ID }}
          password: ${{ secrets.AZ_LATEST_SERVICE_PRINCIPLE_PASSWORD }}
          tenant: ${{ secrets.AZ_LATEST_SERVICE_PRINCIPLE_TENANT }}
          region: az-westus-2
          tier: latest
        with:
          args: rollout status deployment/support
